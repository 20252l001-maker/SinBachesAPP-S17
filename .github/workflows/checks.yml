name: Validar SinBachesAPP
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m zipfile -e source.zip .
      - run: pip install -r requirements-dev.txt
      - run: python scripts/download_model.py
      - run: python -m pytest -q --junitxml=evidence/ci.xml
      - run: docker build -t sinbaches:test .
      - run: docker run -d --name sinbaches -e API_KEY=ci-only-key-012345678901234567890123456789 -p 7860:7860 sinbaches:test
      - run: python scripts/wait_health.py http://127.0.0.1:7860
      - if: always()
        run: docker logs sinbaches
